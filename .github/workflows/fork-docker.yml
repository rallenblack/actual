name: Build fork image (GHCR)

# Builds a Docker image from THIS fork — including all custom features (the web
# client is compiled in) — and pushes it to GitHub Container Registry so the
# self-hosted server can just `docker pull` it instead of building locally.
#
# Image: ghcr.io/<owner>/actual-server:latest  (+ :sha-<short> per build)
# Only linux/amd64 is built (the target laptop is x86-64), which is much faster
# than upstream's multi-arch build.

on:
  push:
    branches:
      - master
      - categories-page-polish
    paths-ignore:
      - 'README.md'
      - 'packages/docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/actual-server

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build web client + sync server
        run: yarn build:server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
